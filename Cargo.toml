[package]
name = "blob"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["tokio"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.22.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
constant_time_eq = "0.4.2"
dirs = "6.0.0"
dunce = "1.0.5"
glob = "0.3.3"
pem = "3.0.6"
rcgen = "0.14.7"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
rustls = { version = "0.23.37", features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.50.0", features = ["full"] }
zip = "8.3.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
debug = false
