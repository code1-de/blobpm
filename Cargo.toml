[package]
name = "blob"
version = "1.7.5"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["server"]
server = ["dep:axum", "dep:axum-server", "dep:tokio", "dep:tower", "dep:futures-util", "dep:chrono"]

[dependencies]
axum = { version = "0.8.8", features = ["tokio"], optional = true }
axum-server = { version = "0.8.0", features = ["tls-rustls"], optional = true }
base64 = "0.22.1"
chrono = { version = "0.4", features = ["clock"], optional = true }
clap = { version = "4.6.0", features = ["derive", "env"] }
constant_time_eq = "0.4.2"
dirs = "6.0.0"
dunce = "1.0.5"
futures-util = { version = "0.3", optional = true }
glob = "0.3.3"
indicatif = "0.18"
pem = "3.0.6"
rcgen = "0.14.7"
regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
rustls = { version = "0.23.37", features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.50.0", features = ["full"], optional = true }
tower = { version = "0.5", features = ["limit"], optional = true }
zip = { version = "8.3.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Foundation",
] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
debug = false
